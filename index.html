<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Under Construction</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    .container {
      background-color: var(--card-bg);
      padding: 3rem 2rem;
      border-radius: 12px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .contact-link {
      display: inline-block;
      color: var(--bg-color);
      background-color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    .contact-link:hover {
      opacity: 0.9;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="badge">Under Construction</span>
    <h1>Big Things Coming</h1>
    <p>Our website is currently undergoing some changes. We'll be back online soon with a fresh new page.</p>
    <a href="mailto:casenuerex@gmail.com" class="contact-link">Contact Us</a>
  </main>
</body>
</html>
